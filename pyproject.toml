[project]
name = "aimo-interp"
version = "0.1.0"
description = "Small Models track entry for the NeurIPS 2026 AIMO Interpretability Challenge"
requires-python = ">=3.11"
# Pinned to the Codabench evaluation image so serialized probes load identically there.
dependencies = [
    "accelerate==1.13.0",
    "huggingface-hub==1.22.0",
    "joblib==1.5.3",
    "pandas==3.0.3",
    "safetensors==0.8.0",
    "scikit-learn==1.8.0",
    "tokenizers==0.22.2",
    "transformers==5.13.0",
    "torch~=2.12.1",
]

[dependency-groups]
# Local tooling only; never available inside the evaluation container.
dev = [
    "pyarrow>=17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aimo_interp"]
